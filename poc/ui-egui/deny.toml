# cargo-deny configuration for the disposable UI proof of concept.
# Same rules as the root deny.toml, plus advisory exceptions approved by the
# owner for this proof of concept only. Keep both files in sync.

[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # zbus family, unmaintained. Used only by AccessKit on Linux; no known
    # vulnerability. Approved by the owner for this proof of concept only.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: Linux-only, PoC only" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: Linux-only, PoC only" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: Linux-only, PoC only" },
]

[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "ISC",
    "Zlib",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "Unicode-3.0",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
