# Disposable prototype for phase 0.6, part 3 (ADR-0021). Not part of the
# main workspace and never a code base for the product.
#
# Only `loja-loro` may depend on Loro; CI checks that `modelo`, `cadeia` and
# `arquivo` do not (ADR-0019, decision 7).
[workspace]
resolver = "3"
members = ["modelo", "loja-loro", "cadeia", "arquivo", "verificador"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
