# cargo-deny configuration (ADR-0012, CLAUDE.md section 5).

[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "allow"
# Only GPL-3.0-compatible licenses for code. Adding one here requires owner
# approval. OFL-1.1 (fonts) and CC0-1.0 (data files) are not listed on
# purpose: they apply to files that are not crates (CLAUDE.md section 5).
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "ISC",
    "Zlib",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "Unicode-3.0",
    "BSL-1.0",
]

[licenses.private]
# Check our own unpublished crates too.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
