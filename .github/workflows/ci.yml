name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # The document core must not depend on the UI or GPU stack
      # (ADR-0009: "o núcleo não depende do framework de interface").
      - name: Core and doc crates stay free of UI and GPU dependencies
        run: |
          if cargo tree -p bivar-core -p bivar-doc -e normal,build --prefix none \
              | grep -E '^(egui|eframe|epaint|winit|wgpu|vello|accesskit)'; then
            echo "::error::bivar-core or bivar-doc depends on a UI or GPU crate"
            exit 1
          fi

      - name: Install cargo-deny and cargo-audit
        run: cargo install --locked cargo-deny cargo-audit

      - name: cargo deny
        run: cargo deny check

      - name: cargo deny rejects incompatible licenses
        run: |
          if cargo deny --manifest-path tests/deny-fixture/Cargo.toml --config deny.toml check licenses; then
            echo "::error::cargo deny accepted a proprietary license"
            exit 1
          fi

      - name: cargo audit
        run: cargo audit

  # Phase 0.5: images rendered without a GPU (vello_cpu) must match, pixel
  # for pixel, the references approved on the owner's PC (Windows).
  poc-text-cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show

      - name: Processor and vello_cpu SIMD level
        run: |
          grep -m1 'model name' /proc/cpuinfo
          cargo run --locked --manifest-path poc/text-parley/Cargo.toml --no-default-features -- --sem-placa

      - name: Text proof tests, without a GPU (exact golden comparison)
        run: cargo test --locked --manifest-path poc/text-parley/Cargo.toml --no-default-features

      - name: Keep the images for the owner to compare
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: poc-text-cpu-images
          path: |
            poc/text-parley/exportacoes/
            poc/text-parley/tests/golden/*.new.png
            poc/text-parley/tests/golden/*.diff.png
          if-no-files-found: ignore
          retention-days: 30

  # Report only: shows which lines the tests run. No minimum yet.
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show

      - name: Install llvm-tools and cargo-llvm-cov
        run: |
          rustup component add llvm-tools-preview
          cargo install --locked cargo-llvm-cov

      - name: Measure coverage
        run: |
          cargo llvm-cov --workspace --summary-only | tee coverage-summary.txt
          cargo llvm-cov report --html
          {
            echo "## Test coverage (report only)"
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the HTML report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: target/llvm-cov/html
          retention-days: 30

  dco:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Find the commits to check
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="$BASE..$HEAD" ;;
            push)
              if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                range="$BEFORE..$SHA"
              else
                range="$SHA"
              fi ;;
            *) range="HEAD" ;;
          esac
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Check Signed-off-by on every commit
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          failed=0
          for c in $(git rev-list --no-merges "$RANGE"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>'; then
              echo "::error::Commit $c has no Signed-off-by line (use git commit -s)"
              failed=1
            fi
          done
          exit $failed

      # Golden images change only with the owner's recorded approval
      # (CLAUDE.md section 6). Commits up to GOLDEN_BASELINE predate the rule.
      - name: Check owner approval for golden image changes
        env:
          RANGE: ${{ steps.range.outputs.range }}
          GOLDEN_BASELINE: 523c87b371e6475b95c72a4dfcfcd9216b8aeb01
          OWNER_EMAIL: 344064416+crocodiliano@users.noreply.github.com
        run: |
          failed=0
          for c in $(git rev-list --no-merges "$RANGE" --not "$GOLDEN_BASELINE"); do
            if git diff-tree --no-commit-id --name-only -r --root "$c" | grep -qE '(^|/)tests/golden/'; then
              if ! git log -1 --format=%B "$c" | grep -E '^Golden-Approved-By: .+ <[^>]+>$' | grep -qF "<$OWNER_EMAIL>"; then
                echo "::error::Commit $c changes tests/golden/ without a Golden-Approved-By line from the owner <$OWNER_EMAIL>"
                failed=1
              fi
            fi
          done
          exit $failed
