name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # The document core must not depend on the UI or GPU stack
      # (ADR-0009: "o núcleo não depende do framework de interface").
      - name: Core and doc crates stay free of UI and GPU dependencies
        run: |
          if cargo tree -p bivar-core -p bivar-doc -e normal,build --prefix none \
              | grep -E '^(egui|eframe|epaint|winit|wgpu|vello|accesskit)'; then
            echo "::error::bivar-core or bivar-doc depends on a UI or GPU crate"
            exit 1
          fi

      # Pinned versions (audit 2026-10-31, M5): a new release cannot change
      # what passes without a commit here.
      - name: Install cargo-deny and cargo-audit
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-audit --version 0.22.2

      - name: cargo deny
        run: cargo deny check

      - name: cargo deny rejects incompatible licenses
        run: |
          if cargo deny --manifest-path tests/deny-fixture/Cargo.toml --config deny.toml check licenses; then
            echo "::error::cargo deny accepted a proprietary license"
            exit 1
          fi

      # Unsound advisories (memory safety) fail the build (I7).
      - name: cargo audit
        run: cargo audit --deny unsound

  # Phase 0.5: images rendered without a GPU (vello_cpu) must match, pixel
  # for pixel, the references approved on the owner's PC (Windows).
  poc-text-cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show

      - name: Processor and vello_cpu SIMD level
        run: |
          grep -m1 'model name' /proc/cpuinfo
          cargo run --locked --manifest-path poc/text-parley/Cargo.toml --no-default-features -- --sem-placa

      - name: Text proof tests, without a GPU (exact golden comparison)
        run: cargo test --locked --manifest-path poc/text-parley/Cargo.toml --no-default-features

      # The proof is outside the workspace, so its dependencies (Parley, ICU)
      # are checked here: licenses, sources and security advisories.
      - name: cargo deny on the text proof
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo deny --manifest-path poc/text-parley/Cargo.toml --config poc/text-parley/deny.toml check

      - name: Keep the images for the owner to compare
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: poc-text-cpu-images
          path: |
            poc/text-parley/exportacoes/
            poc/text-parley/tests/golden/*.new.png
            poc/text-parley/tests/golden/*.diff.png
          if-no-files-found: ignore
          retention-days: 30

  # Phase 0.6: storage and sync proofs (ADR-0021). Only the store crate may
  # depend on Loro, at the approved exact version (ADR-0019, decision 7).
  # CI runs 6 random merge scenarios per test; the full 2,000 + 2,000 run
  # on the owner's PC before closing a delivery or accepting a Loro update.
  poc-crdt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show

      - name: Only the store crate depends on Loro
        run: sh poc/crdt-armazenamento/prototipo/check-loro-isolated.sh

      # Also here, not only in the Fuzz workflow: a change to the code the
      # program runs before the verifier fails in the same push unless
      # fuzz/before-verifier.txt follows it (owner, 2026-11-11, D-1).
      - name: Tests of the fuzzing family grouping (fuzz/before-verifier.txt)
        run: python3 fuzz/test_fork_families.py

      # The prototype is outside the workspace: its format and lints are
      # checked here (audit 2026-10-31, M14).
      - name: Prototype format and lints
        run: |
          cargo fmt --manifest-path poc/crdt-armazenamento/prototipo/Cargo.toml --all --check
          cargo clippy --locked --release --manifest-path poc/crdt-armazenamento/prototipo/Cargo.toml --all-targets -- -D warnings

      # One test at a time (owner, 2026-11-10). On Linux, closing and
      # reopening a locked file while another test spawns the verifier can
      # make the lock refused with no other session holding the file; the
      # cause was not proved to be the only one, and in series it never
      # happened (0 refusals in 7,471 runs). See
      # docs/auditoria/2026-11-04-falha-ci-trava.md and ADR-0023, section 3.
      - name: Prototype tests (model, Loro store, chain)
        run: cargo test --locked --release --manifest-path poc/crdt-armazenamento/prototipo/Cargo.toml -- --test-threads=1

      - name: Comparison proof tests (Loro x Automerge)
        run: cargo test --locked --release --manifest-path poc/crdt-armazenamento/Cargo.toml

      # The proofs are outside the workspace, so their dependencies are
      # checked here: licenses, sources and security advisories. They run
      # even when a test step above failed (owner, 2026-11-04); the job
      # still fails if the tests did.
      - name: cargo deny and cargo audit on both proofs and on fuzz/
        if: success() || failure()
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-audit --version 0.22.2
          cargo deny --manifest-path poc/crdt-armazenamento/Cargo.toml --config poc/crdt-armazenamento/deny.toml check
          cargo deny --manifest-path poc/crdt-armazenamento/prototipo/Cargo.toml --config poc/crdt-armazenamento/prototipo/deny.toml check
          # Unsound advisories fail (I7, M14), except the two in Loro's
          # dependencies the owner approved for the proofs (2026-10-29).
          for lock in poc/crdt-armazenamento/Cargo.lock poc/crdt-armazenamento/prototipo/Cargo.lock fuzz/Cargo.lock; do
            cargo audit --file "$lock" --deny unsound --ignore RUSTSEC-2023-0126 --ignore RUSTSEC-2026-0255
          done

  # Report only: shows which lines the tests run. No minimum yet.
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show

      - name: Install llvm-tools and cargo-llvm-cov
        run: |
          rustup component add llvm-tools-preview
          cargo install --locked cargo-llvm-cov

      - name: Measure coverage
        run: |
          cargo llvm-cov --workspace --summary-only | tee coverage-summary.txt
          cargo llvm-cov report --html
          {
            echo "## Test coverage (report only)"
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the HTML report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: target/llvm-cov/html
          retention-days: 30

  dco:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Find the commits to check
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="$BASE..$HEAD" ;;
            push)
              if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                range="$BEFORE..$SHA"
              else
                range="$SHA"
              fi ;;
            *) range="HEAD" ;;
          esac
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Check Signed-off-by on every commit
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          failed=0
          for c in $(git rev-list --no-merges "$RANGE"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>'; then
              echo "::error::Commit $c has no Signed-off-by line (use git commit -s)"
              failed=1
            fi
          done
          exit $failed

      # The .bivar files every future version must open (owner, 2026-10-31):
      # files are only ever added to tests/formato/, never changed, renamed
      # or deleted. A new format version comes in as new files.
      - name: tests/formato only grows
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          failed=0
          for c in $(git rev-list --no-merges "$RANGE"); do
            changed=$(git diff-tree --no-commit-id --root -r --name-status --diff-filter=DMRTC "$c" -- tests/formato/)
            if [ -n "$changed" ]; then
              echo "::error::Commit $c changes or removes files in tests/formato/ (only adding is allowed):"
              echo "$changed"
              failed=1
            fi
          done
          exit $failed

      # Golden images change only with the owner's recorded approval
      # (CLAUDE.md section 6). Commits up to GOLDEN_BASELINE predate the rule.
      - name: Check owner approval for golden image changes
        env:
          RANGE: ${{ steps.range.outputs.range }}
          GOLDEN_BASELINE: 523c87b371e6475b95c72a4dfcfcd9216b8aeb01
          OWNER_EMAIL: 344064416+crocodiliano@users.noreply.github.com
        run: |
          failed=0
          for c in $(git rev-list --no-merges "$RANGE" --not "$GOLDEN_BASELINE"); do
            if git diff-tree --no-commit-id --name-only -r --root "$c" | grep -qE '(^|/)tests/golden/'; then
              if ! git log -1 --format=%B "$c" | grep -E '^Golden-Approved-By: .+ <[^>]+>$' | grep -qF "<$OWNER_EMAIL>"; then
                echo "::error::Commit $c changes tests/golden/ without a Golden-Approved-By line from the owner <$OWNER_EMAIL>"
                failed=1
              fi
            fi
          done
          exit $failed
