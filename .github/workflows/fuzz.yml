name: Fuzz

# Fuzzing of every external-input reader (ADR-0011, ADR-0024). Each target
# runs 2 minutes on every push and 30 minutes once a day. The nightly
# toolchain is pinned in fuzz/rust-toolchain.toml and used only here.

on:
  push:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [bivar_container, bivar_records]
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned nightly toolchain (fuzz/ only)
        working-directory: fuzz
        run: rustup show

      - name: Install cargo-fuzz
        working-directory: fuzz
        run: cargo install --locked cargo-fuzz --version 0.13.2

      - name: Licenses and advisories of the fuzzing folder (NCSA allowed only here)
        working-directory: fuzz
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo deny --manifest-path Cargo.toml --config deny.toml check

      # The corpus grows from run to run instead of starting again from the
      # seeds each time (audit 2026-10-31, M5). Only the inputs the fuzzer
      # found are cached; the seeds stay in the repository.
      - name: Restore the corpus found by earlier runs
        uses: actions/cache@v4
        with:
          path: fuzz/found/${{ matrix.target }}
          key: fuzz-found-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-found-${{ matrix.target }}-

      # -max_len: without it libFuzzer keeps inputs no longer than the
      # largest seed (about 6.6 KB) and never reaches large records (M5).
      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        env:
          SECONDS_TO_RUN: ${{ github.event_name == 'schedule' && '1800' || '120' }}
        run: |
          mkdir -p found/${{ matrix.target }}
          cargo fuzz run ${{ matrix.target }} found/${{ matrix.target }} corpus/${{ matrix.target }} -- \
            -max_total_time=$SECONDS_TO_RUN -rss_limit_mb=4096 -timeout=60 -max_len=1048576

      # A crash leaves its input in fuzz/artifacts; keep it so it can become
      # a file in fuzz/regressions (replayed by the normal tests).
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          retention-days: 30
