name: Fuzz

# Fuzzing of every external-input reader (ADR-0011, ADR-0024). Each target
# runs about 2 minutes on every push and about 30 minutes once a day, in
# libFuzzer's fork mode (fuzz/run-fork.sh). The nightly toolchain is pinned
# in fuzz/rust-toolchain.toml and used only here.
#
# Fork mode (owner, 2026-11-10 and 2026-11-11; audit 2026-11-10, I1 and M6):
# - every starting input is first run alone (fork mode would skip a failing
#   one silently);
# - out-of-memory and crashes are ignored during the run, timeouts stop it;
# - the grouping by family decides: a known family gives a warning and a
#   green job; a new family, one through the code before the verifier, or an
#   input that cannot be classified turns it red. The inputs to keep go to
#   the artifact (fuzz/kept/<target>/reserve; fuzz/artifacts/ when the
#   grouping did not finish).

on:
  push:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    # Setup takes about 6 minutes (run 42963684339); the fuzzing step has a
    # limit of its own below, so the artifact is still uploaded.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [bivar_container, bivar_records]
    steps:
      - uses: actions/checkout@v5

      # The grouping decides green or red by family (audit 2026-11-10, I1):
      # its tests run before any fuzzing.
      - name: Tests of the family grouping
        run: python3 fuzz/test_fork_families.py

      - name: Install the pinned nightly toolchain (fuzz/ only)
        working-directory: fuzz
        run: rustup show

      - name: Install cargo-fuzz
        working-directory: fuzz
        run: cargo install --locked cargo-fuzz --version 0.13.2

      - name: Licenses and advisories of the fuzzing folder (NCSA allowed only here)
        working-directory: fuzz
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo deny --manifest-path Cargo.toml --config deny.toml check

      # The corpus grows from run to run instead of starting again from the
      # seeds each time (audit 2026-10-31, M5). Only the inputs the fuzzer
      # found are cached; the seeds stay in the repository.
      - name: Restore the corpus found by earlier runs
        uses: actions/cache@v4
        with:
          path: fuzz/found/${{ matrix.target }}
          key: fuzz-found-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-found-${{ matrix.target }}-

      - name: Build ${{ matrix.target }}
        working-directory: fuzz
        run: cargo fuzz build ${{ matrix.target }}

      # The seconds asked are the budget minus the 300 s a child can still
      # run after the time ends: 1500 s once a day (at most 1800 s in all).
      # On a push, 120 s: children started in 2 minutes run for at most
      # about 20 s each.
      - name: Fuzz ${{ matrix.target }} (fork mode)
        working-directory: fuzz
        env:
          SECONDS_TO_RUN: ${{ github.event_name == 'schedule' && '1500' || '120' }}
        # Shorter than the job, so the upload below still runs (owner,
        # 2026-11-11). Worst case: seed check 120 + 90 s, fuzzing 1500 + 300 s,
        # grouping 300 s (38.5 min, cut here: red); the daily run of
        # 42963684339 fuzzed for 1502-1515 s.
        timeout-minutes: 33
        run: bash run-fork.sh ${{ matrix.target }} "$SECONDS_TO_RUN"

      - name: TEMPORARY stacks and families of the kept inputs (proof branch)
        if: always()
        working-directory: fuzz
        run: |
          for f in kept/${{ matrix.target }}/*/replay.txt; do
            [ -f "$f" ] || continue
            echo "::notice title=stack $f::$(grep -E "^ *#[0-9]+ .* in (bivar|loro)|panicked at|ERROR: " "$f" | head -14 | sed "s/^ *//" | tr '\n' '|' | cut -c1-3800)"
          done
          tail -n +2 kept/${{ matrix.target }}/families.tsv 2>/dev/null | while IFS= read -r l; do echo "::notice title=family::$l"; done
          echo "::notice title=kept files::$(find kept fork-out artifacts -type f 2>/dev/null | grep -v -e fuzz.log | sort | tr '\n' ' ' | cut -c1-3800)"

      # One input per family (crash, timeout or out-of-memory), with the text
      # of its run, and the reserve of inputs (M6); a crash input can become a
      # file in fuzz/regressions, or in fuzz/verifier-refused while the
      # document library still falls.
      - name: Keep one input per family
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-families-${{ matrix.target }}
          path: |
            fuzz/kept/
            fuzz/fork-out/
            fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30
