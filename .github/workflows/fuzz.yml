name: Fuzz

# Fuzzing of every external-input reader (ADR-0011, ADR-0024). Each target
# runs about 2 minutes on every push and about 30 minutes once a day, in
# libFuzzer's fork mode (fuzz/run-fork.sh). The nightly toolchain is pinned
# in fuzz/rust-toolchain.toml and used only here.
#
# Fork mode (owner, 2026-11-10; audit report 2026-11-04, section 12):
# - only out-of-memory is ignored (-ignore_ooms=1): it is the verifier's
#   refusal family, and the program survives it. Each one is counted in the
#   log, and one input per family is kept;
# - a panic, any other crash, or a timeout stops the run and turns the job
#   red, with one input per family kept.

on:
  push:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    # Setup takes about 4 minutes; the fuzzing itself at most 1500 s plus
    # 300 s for the last children (run-fork.sh); grouping at most 150 s.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [bivar_container, bivar_records]
    steps:
      - uses: actions/checkout@v5

      # The grouping decides green or red by family (audit 2026-11-10, I1):
      # its tests run before any fuzzing.
      - name: Tests of the family grouping
        run: python3 fuzz/test_fork_families.py

      - name: Install the pinned nightly toolchain (fuzz/ only)
        working-directory: fuzz
        run: rustup show

      - name: Install cargo-fuzz
        working-directory: fuzz
        run: cargo install --locked cargo-fuzz --version 0.13.2

      - name: Licenses and advisories of the fuzzing folder (NCSA allowed only here)
        working-directory: fuzz
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo deny --manifest-path Cargo.toml --config deny.toml check

      # The corpus grows from run to run instead of starting again from the
      # seeds each time (audit 2026-10-31, M5). Only the inputs the fuzzer
      # found are cached; the seeds stay in the repository.
      - name: Restore the corpus found by earlier runs
        uses: actions/cache@v4
        with:
          path: fuzz/found/${{ matrix.target }}
          key: fuzz-found-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-found-${{ matrix.target }}-

      - name: Build ${{ matrix.target }}
        working-directory: fuzz
        run: cargo fuzz build ${{ matrix.target }}

      # The seconds asked are the budget minus the 300 s a child can still
      # run after the time ends: 1500 s once a day (at most 1800 s in all).
      # On a push, 120 s: children started in 2 minutes run for at most
      # about 20 s each.
      - name: Fuzz ${{ matrix.target }} (fork mode)
        working-directory: fuzz
        env:
          SECONDS_TO_RUN: ${{ github.event_name == 'schedule' && '1500' || '120' }}
        run: bash run-fork.sh ${{ matrix.target }} "$SECONDS_TO_RUN"

      # One input per family (crash, timeout or out-of-memory), with the text
      # of its run; a crash input can become a file in fuzz/regressions, or
      # in fuzz/verifier-refused while the document library still falls.
      - name: Keep one input per family
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-families-${{ matrix.target }}
          path: |
            fuzz/kept/
            fuzz/fork-out/fuzz.log
          if-no-files-found: ignore
          retention-days: 30
