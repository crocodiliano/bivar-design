# Temporary diagnosis of the CI failure of 2026-11-03 (run 41693430250,
# dd7d0af). Lives only on the branch diag/trava-linux, which is never
# merged into main (owner, 2026-11-04). Second measure (owner, 2026-11-04):
#
# repro: a separate program without Bivar code (poc/diag-trava-repro) opens,
#   locks, closes and reopens one file in a loop, counting refusals; M1 with
#   other threads launching /bin/true for 5 minutes, M2 without launches.
# copias-ac: the copias suite, compiled once, alternating A (as is) and C
#   (a diagnosis-only global lock: no verifier launch while a file lock is
#   asked for), up to 500 runs each or 30 minutes, never stopping early.
name: Diag lock (temporary)

on:
  push:
    branches: [diag/trava-linux]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show

      - name: Build the reproduction
        run: cargo build --locked --release --manifest-path poc/diag-trava-repro/Cargo.toml

      - name: M1, with launches, 5 minutes
        run: |
          mkdir -p diag
          poc/diag-trava-repro/target/release/bivar-diag-trava-repro spawn 300 4 "$RUNNER_TEMP/m1.lock" | tee -a diag/repro.txt

      - name: M2, without launches, 5 minutes
        if: success() || failure()
        run: |
          mkdir -p diag
          poc/diag-trava-repro/target/release/bivar-diag-trava-repro nospawn 300 4 "$RUNNER_TEMP/m2.lock" | tee -a diag/repro.txt

      - name: Report as annotations
        if: success() || failure()
        run: while read -r l; do echo "::notice title=Repro::$l"; done < diag/repro.txt

      - name: Keep the results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: diag-trava-repro
          path: diag/
          retention-days: 30

  copias-ac:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show

      - name: Build the copias suite once
        run: |
          set -o pipefail
          BIN=$(cargo test --locked --release \
            --manifest-path poc/crdt-armazenamento/prototipo/Cargo.toml \
            -p bivar-poc-verificador --test copias --no-run --message-format=json \
            | jq -r 'select(.reason=="compiler-artifact" and .target.name=="copias" and .profile.test==true) | .executable')
          test -x "$BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: A and C alternating, 500 runs each or 30 minutes
        run: bash .github/workflows/diag-trava-ac.sh

      - name: Report as annotations
        if: success() || failure()
        run: while read -r l; do echo "::notice title=A and C::$l"; done < diag/summary.txt

      - name: Keep the logs
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: diag-trava-ac
          path: diag/
          retention-days: 30
