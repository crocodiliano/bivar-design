[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["tests/deny-fixture", "poc/ui-egui", "poc/render-vello", "poc/text-parley"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

# unsafe is denied everywhere (ADR-0012, CLAUDE.md section 4). A crate may
# allow it only with owner approval recorded in docs/unsafe.md.
[workspace.lints.rust]
unsafe_code = "deny"
